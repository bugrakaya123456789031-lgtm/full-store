name: Build PS5 Full Store ELF

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bash git clang-18 lld-18 make wget tar unzip
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++

      - name: Setup prebuilt PS5 Payload SDK
        run: |
          sudo mkdir -p /opt/ps5-payload-sdk
          wget -q https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip -O /tmp/sdk.zip
          sudo unzip -q /tmp/sdk.zip -d /tmp/sdk_extracted
          if [ -d "/tmp/sdk_extracted/ps5-payload-sdk" ]; then
            sudo cp -r /tmp/sdk_extracted/ps5-payload-sdk/* /opt/ps5-payload-sdk/
          else
            sudo cp -r /tmp/sdk_extracted/* /opt/ps5-payload-sdk/
          fi
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV

      - name: Setup Pacbrew port libraries
        run: |
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.40.3/ps5-payload-dev.tar.gz -O /tmp/ports.tar.gz
          sudo tar -xzf /tmp/ports.tar.gz -C /opt/ps5-payload-sdk/ || true

      - name: Compile full-store.elf
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          export PATH=$PATH:/opt/ps5-payload-sdk/bin
          make -j$(nproc)

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-store-elf
          path: full-store.elf
