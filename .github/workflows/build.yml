name: Build PS5 Full Store ELF

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash git cmake ninja-build clang-18 lld-18 make python3 python3-pyelftools wget xz-utils pkg-config sudo unzip libssl-dev
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++

      - name: Install ps5-payload-sdk
        run: |
          git clone --recursive https://github.com/ps5-payload-dev/sdk /opt/ps5-payload-sdk
          cd /opt/ps5-payload-sdk
          make -j$(nproc)
          sudo make install
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV

      - name: Install Pacbrew ports
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          export PATH=$PATH:$PS5_PAYLOAD_SDK/bin
          if command -v pacbrew-pm &> /dev/null; then
            pacbrew-pm install curl mbedtls zlib libarchive sdl2 sdl2_image sdl2_ttf freetype
          elif [ -f "$PS5_PAYLOAD_SDK/bin/pacbrew-pm" ]; then
            $PS5_PAYLOAD_SDK/bin/pacbrew-pm install curl mbedtls zlib libarchive sdl2 sdl2_image sdl2_ttf freetype
          fi

      - name: Build full-store.elf
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make -j$(nproc)

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-store-elf
          path: full-store.elf
