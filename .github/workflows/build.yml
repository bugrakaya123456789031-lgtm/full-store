name: Build PS5 Full Store ELF

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bash git clang-18 lld-18 make wget tar unzip
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++

      - name: Setup prebuilt PS5 Payload SDK
        run: |
          sudo mkdir -p /opt/ps5-payload-sdk
          wget -q https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip -O /tmp/sdk.zip
          sudo unzip -q /tmp/sdk.zip -d /tmp/sdk_extracted
          if [ -d "/tmp/sdk_extracted/ps5-payload-sdk" ]; then
            sudo cp -r /tmp/sdk_extracted/ps5-payload-sdk/* /opt/ps5-payload-sdk/
          else
            sudo cp -r /tmp/sdk_extracted/* /opt/ps5-payload-sdk/
          fi
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV
          echo "/opt/ps5-payload-sdk/bin" >> $GITHUB_PATH

      - name: Setup Pacbrew port libraries
        run: |
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.40.3/ps5-payload-dev.tar.gz -O /tmp/ports.tar.gz
          sudo tar -xzf /tmp/ports.tar.gz -C /
          sudo chmod -R +x /opt/ps5-payload-sdk/bin || true
          ls -la /opt/ps5-payload-sdk/target/user/homebrew/include || true

      - name: Compile full-store.elf
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          export PATH=/opt/ps5-payload-sdk/bin:$PATH
          make -j$(nproc) > make.log 2>&1 || true
          cat make.log
          if [ ! -f full-store.elf ]; then
            exit 1
          fi

      - name: Publish log to branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add -f make.log
          git commit -m "build log [skip ci]" || true
          git push -f origin build-logs || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: make.log

      - name: Upload ELF Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: full-store-elf
          path: full-store.elf

